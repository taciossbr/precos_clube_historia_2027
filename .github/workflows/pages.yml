name: Atualizar preços e publicar dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      somente_publicar:
        description: Publica o site com os dados já versionados, sem coletar preços
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "23 5,10,16,19,21 * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restaurar e guardar estado de preços
        if: ${{ inputs.somente_publicar != true }}
        uses: actions/cache@v4
        with:
          path: |
            consolidado.json
            historico.json
            erros_consecutivos.json
            alertas_enviados.json
          key: precos-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            precos-${{ github.ref_name }}-

      - name: Instalar dependências
        if: ${{ inputs.somente_publicar != true }}
        run: python -m pip install -r requirements.txt

      - name: Instalar Firefox para Playwright
        if: ${{ inputs.somente_publicar != true }}
        run: python -m playwright install --with-deps firefox

      - name: Coletar preços e atualizar histórico
        if: ${{ inputs.somente_publicar != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commitar estado atualizado
        if: ${{ inputs.somente_publicar != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add consolidado.json historico.json erros_consecutivos.json alertas_enviados.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza histórico de preços [skip ci]"
            git push
          fi

      - name: Preparar GitHub Pages
        run: python build_site.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
